# CI on every change (P4.4).
#
# The whole pipeline, on a clean machine, on every push and pull request: install → data gate →
# datasets → engine → backtest → tests → dashboard → server smoke test. Red means the change does not
# ship, and because `run_all.py` refuses to build on a failed gate, "green" means the numbers in the
# dashboard were produced by a dataset that passed every check.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt and pytest. A bare
          # `pip install -r requirements.txt` used to be enough for the pipeline but not for the
          # tests, and the difference only showed up here — never locally, where pytest is already
          # on the machine. Install both.
          pip install -r requirements-dev.txt

      # ── the gate, called out on its own so a data failure is unambiguous in the UI ──────────
      - name: Data validation gate
        run: python3 validate_data.py

      # ── everything else, in the same order a human would run it ────────────────────────────
      - name: Pipeline, tests and dashboard
        run: python3 run_all.py

      # ── the zero-dependency promise, checked rather than asserted ─────────────────────────────
      # requirements.txt carries no test tooling, and the suite is documented to run on a bare
      # interpreter. This step proves it: a stub `pytest` module that refuses to import is put
      # first on the path, so any test module that grows a bare `import pytest` fails right here.
      - name: Tests run without pytest installed
        run: |
          mkdir -p /tmp/nopytest
          printf 'raise ImportError("pytest is not installed (simulated)")\n' > /tmp/nopytest/pytest.py
          PYTHONPATH=/tmp/nopytest python3 tests/run_tests.py

      # The weekly job is the part that can quietly rot, so it runs here too — with no network and
      # no key, against the checked-in dataset, which is exactly the fallback path.
      - name: Weekly job (offline dry run)
        env:
          NT90_SOURCE: local
        run: python3 update_week.py --dry-run

      # ── the committed page must match the committed sources ────────────────────────────────
      # Not `git diff` on the file. The page embeds projected numbers, and their last decimals come
      # from whichever numpy/scipy/scikit-learn the runner installed — so a byte comparison fails on
      # a page that is perfectly current. check_page_current.py compares the two builds by identity
      # (club, player, fixture, scoreline), holds every data-derived number to exact equality, and
      # allows only a documented band on the projections, printing the largest drift it finds.
      - name: Dashboard is current and reproducible
        run: |
          git show HEAD:static/index.html > /tmp/committed_index.html
          python3 check_page_current.py --against /tmp/committed_index.html

      # ── does it actually serve? (boots, warms, answers, then dies) ─────────────────────────
      - name: Server smoke test
        run: |
          PORT=8123 NT90_PRELOAD=1 python3 server.py & SRV=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8123/readyz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          set -e
          curl -fsS http://127.0.0.1:8123/healthz
          curl -fsS http://127.0.0.1:8123/readyz | head -c 400; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/)" = 200
          test "$(curl -s -o /dev/null -w '%{content_type}' --compressed http://127.0.0.1:8123/)" = "text/html; charset=utf-8"
          ENC=$(curl -s -o /dev/null -w '%{size_download}' --compressed http://127.0.0.1:8123/)
          RAW=$(curl -s -o /dev/null -w '%{size_download}' -H 'Accept-Encoding: identity' http://127.0.0.1:8123/)
          echo "page: ${ENC} bytes gzipped vs ${RAW} identity"
          test "$ENC" -lt "$RAW"
          curl -fsS -X POST http://127.0.0.1:8123/api/simulate \
            -H 'Content-Type: application/json' \
            -d '{"n_sims":600,"team_boosts":{"ARS":{"attack":5,"defence":5}}}' | head -c 200; echo
          kill $SRV

      - name: Upload the built dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: static/index.html
          retention-days: 14
          if-no-files-found: warn
