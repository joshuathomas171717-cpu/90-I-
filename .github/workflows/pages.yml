# Publish the dashboard to GitHub Pages — a live URL with no server and no bill.
#
# `static/index.html` is a single self-contained file (fonts inlined as base64, crests drawn as inline
# SVG, zero external requests), which is exactly what a static host wants. There is no Python API
# behind Pages, so the page falls back to its in-browser engine — see PUBLISH.md §3.
#
# Triggers:
#   * push to main                 — a human changed something
#   * the Weekly update finishing  — a *bot* commit does not trigger other workflows (GitHub's
#                                    GITHUB_TOKEN rule), so the weekly refresh would otherwise
#                                    publish new data and leave the live site a week behind
#   * manual
name: Pages

on:
  push:
    branches: [main]
    paths: ["static/**", "data/**", "build_dashboard.py", "ml_engine.py", "data_builder.py",
            ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Weekly update"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A weekly run that failed validation should NOT redeploy: the point of that job is that
    # production keeps serving the last good snapshot.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Rebuild from source rather than trusting the committed file, so the site and the code can
      # never drift — and then check the rebuild against the committed page (see the next step).
      # The model itself is seeded and deterministic: a clean-room rebuild reproduces all 8,784
      # projected numbers to the last decimal, and the only field that ever moves is `runtime_ms`,
      # the model training time, which measures the machine and is deliberately not compared.
      - name: Rebuild the dashboard
        run: python3 build_dashboard.py

      # The crawlable pages, preview cards, icons and sitemap are generated from the same data. They
      # are committed, but rebuilding them here means the deployed site can never be a mixture of a
      # fresh dashboard and week-old club pages.
      - name: Rebuild the crawlable pages and previews
        run: python3 site_pages.py

      # Compared the same way CI does it, and for the same reason: a byte-for-byte diff of this file
      # fails on library drift and blocks the deploy of a page that is perfectly current.
      # See check_page_current.py.
      - name: Fail if the committed page was stale
        run: |
          git show HEAD:static/index.html > /tmp/committed_index.html
          python3 check_page_current.py --against /tmp/committed_index.html

      # The page is one file, so the artifact is one file. No Jekyll, no dependencies.
      #
      # `enablement: true` lets the action switch Pages on itself (it has `pages: write` above). Without
      # it, the first run of this workflow fails at this step on a repository where Pages has never been
      # enabled — with a message telling a human to go and click a setting. With it, the common case
      # (a personal repository, an Actions token) needs no clicking at all. If the token is not allowed
      # to change repository settings, the action says so and the step fails exactly as before.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
